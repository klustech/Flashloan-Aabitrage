version: "3.9"
services:
  # Ethereum node (Anvil forking mainnet)
  hardhat:
    image: ghcr.io/foundry-rs/foundry:latest
    command: ["anvil", "--fork-url", "${MAINNET_RPC_URL}", "--port", "8545"]
    ports:
      - "8545:8545"

  # Redis for distributed state / caching
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL for trade persistence
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DB:-flashloan_arb}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${PG_USER:-postgres} -d ${PG_DB:-flashloan_arb}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express API / bot server (shared execution modules require the repository context)
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      - MAINNET_RPC_URL=http://hardhat:8545
      - PRIVATE_KEY=${PRIVATE_KEY}
      - RELAY_AUTH_PRIVATE_KEY=${RELAY_AUTH_PRIVATE_KEY:-}
      - CONTRACT_ADDRESS=${CONTRACT_ADDRESS}
      - AAVE_LENDING_POOL_ADDRESS_PROVIDER=${AAVE_LENDING_POOL_ADDRESS_PROVIDER}
      - TOKENS_DAI=${TOKENS_DAI}
      - TOKENS_WETH=${TOKENS_WETH}
      - TOKENS_USDC=${TOKENS_USDC}
      - UNISWAP_ROUTER_ADDRESS=${UNISWAP_ROUTER_ADDRESS}
      - SUSHISWAP_ROUTER_ADDRESS=${SUSHISWAP_ROUTER_ADDRESS}
      - SLIPPAGE_BIPS=${SLIPPAGE_BIPS}
      - GAS_PRICE_CEILING=${GAS_PRICE_CEILING}
      - FLASHBOTS_RELAY_URL=${FLASHBOTS_RELAY_URL}
      - MIN_PROFIT_DAI=${MIN_PROFIT_DAI}
      - PORT=3001
      - API_BIND_HOST=0.0.0.0
      # Redis
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # PostgreSQL
      - PG_HOST=postgres
      - PG_PORT=5432
      - PG_USER=${PG_USER:-postgres}
      - PG_PASSWORD=${PG_PASSWORD:-postgres}
      - PG_DB=${PG_DB:-flashloan_arb}
      - DATABASE_URL=postgres://${PG_USER:-postgres}:${PG_PASSWORD:-postgres}@postgres:5432/${PG_DB:-flashloan_arb}
    ports:
      - "3001:3001"
    depends_on:
      hardhat:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - "./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    ports:
      - "9090:9090"
    depends_on:
      - api

  # Grafana for dashboards
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  redis-data:
  postgres-data:
