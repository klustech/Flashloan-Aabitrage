name: Production core
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: cd server && npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run test:core
      - run: npm test
      - name: Ordered unsigned local-fork pipeline
        run: |
          npx hardhat node --config hardhat.backrun.config.js --no-deploy --hostname 127.0.0.1 --port 8547 > /tmp/backrun-fork.log 2>&1 &
          fork_pid=$!
          trap 'kill "$fork_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -sf -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8547 > /dev/null; then break; fi
            sleep 1
          done
          LOCAL_BACKRUN_TEST_RPC=http://127.0.0.1:8547 node --test test/unit/backrunFork.node.test.js
      - name: Ordered canonical blob and unsigned Anvil pipeline
        run: |
          npm run backrun:install-anvil
          node scripts/backrun-fork-node.js --anvil > /tmp/backrun-anvil.log 2>&1 &
          fork_pid=$!
          trap 'kill "$fork_pid" || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -sf -H 'content-type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:8548 > /dev/null; then break; fi
            sleep 1
          done
          LOCAL_BACKRUN_TEST_RPC=http://127.0.0.1:8548 LOCAL_BACKRUN_TEST_ENGINE=anvil node --test test/unit/backrunFork.node.test.js
      - run: cd frontend && npm ci --ignore-scripts --legacy-peer-deps
      - run: cd frontend && CI=true npm test -- --watchAll=false --runInBand
      - run: cd frontend && CI=false npm run build
  persistence:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: arbitrage_test}
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-retries 5
    env:
      PG_USER: postgres
      PG_PASSWORD: postgres
      PG_HOST: localhost
      PG_DB: arbitrage_test
      PG_PORT: '5432'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts --legacy-peer-deps
      - run: npm run db:migrate:executions
      - run: node scripts/check-execution-persistence.js
      - run: node scripts/check-backrun-persistence.js
