# .github/workflows/ci.yml
# Comprehensive CI Pipeline for Flashloan Arbitrage Bot

name: CI

on:
  push:
    branches: [main, dev, feature/*]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.10"

jobs:
  # Smart Contract Tests
  contracts:
    name: Smart Contract Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile --force

      - name: Run Hardhat tests
        run: npx hardhat test --network hardhat
        env:
          REPORT_GAS: true

      - name: Run solidity-coverage
        run: npm run coverage
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          flags: contracts

  # Foundry Tests
  foundry:
    name: Foundry Fuzz Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run Foundry tests
        run: forge test -vvv

  # Static Analysis (advisory only — does not gate the pipeline)
  security:
    name: Security Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (advisory)
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Static analysis with Slither (advisory)
        run: |
          if [ -f scripts/slither.sh ]; then
            chmod +x scripts/slither.sh
            ./scripts/slither.sh || true
          fi
        continue-on-error: true

      - name: Run Slither Action (advisory)
        uses: crytic/slither-action@v0.3.0
        continue-on-error: true
        with:
          target: "contracts/"
          slither-args: "--exclude-dependencies"

  # Backend Tests (real gate)
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flashloan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DB: flashloan_test
          PG_USER: postgres
          PG_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Run database smoke test
        run: node server/tests/dbClientSmoke.test.js
        env:
          PG_HOST: localhost
          PG_PORT: 5432
          PG_DB: flashloan_test
          PG_USER: postgres
          PG_PASSWORD: postgres

  # Frontend Build
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          CI: false

  # ML Service Tests (real gate)
  ml-service:
    name: ML Service Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd ml
          pip install -r requirements.txt
          pip install pytest

      - name: Run ML tests
        run: |
          cd ml
          # Real gate: fail on actual test failures. pytest exit code 5 means
          # "no tests collected" (none exist yet) — treat that as a pass so the
          # job does not fail spuriously, but any genuine failure fails CI.
          python -m pytest; rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "No ML tests collected — skipping."
            exit 0
          fi
          exit "$rc"

  # Integration Tests (mainnet fork) — real gate
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: [contracts]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run fork tests
        run: |
          ENABLE_MAINNET_FORK=true npx hardhat test test/integration/*.js
        env:
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
