name: Build Docker Images

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: flashloan-arb/server:latest

      - name: Build ml image
        uses: docker/build-push-action@v5
        with:
          # ML sources live at the repo root (/ml), so build from the root context.
          context: .
          file: ./server/Dockerfile.ml
          push: false
          tags: flashloan-arb/ml:latest
