apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot-logic
  namespace: flashloan-arb
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bot-logic
  template:
    metadata:
      labels:
        app: bot-logic
    spec:
      containers:
        - name: bot-logic
          image: ghcr.io/flashloan-arb/bot:latest
          ports:
            - containerPort: 3001
          env:
            - name: INFURA_KEY
              valueFrom:
                secretKeyRef:
                  name: arb-secrets
                  key: INFURA_KEY
            - name: PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: arb-secrets
                  key: PRIVATE_KEY
            - name: MAINNET_WEBSOCKET
              valueFrom:
                secretKeyRef:
                  name: arb-secrets
                  key: MAINNET_WEBSOCKET
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arb-secrets
                  key: REDIS_PASSWORD
      imagePullSecrets:
        - name: regcred
---
apiVersion: v1
kind: Service
metadata:
  name: bot-logic-svc
  namespace: flashloan-arb
spec:
  selector:
    app: bot-logic
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP
