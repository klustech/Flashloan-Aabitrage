apiVersion: apps/v1
kind: Deployment
metadata:
  name: ml-scorer-deploy
  namespace: flashloan-arb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ml-scorer
  template:
    metadata:
      labels:
        app: ml-scorer
    spec:
      containers:
        - name: ml-scorer
          image: ghcr.io/flashloan-arb/ml-scorer:latest
          ports:
            - containerPort: 3002
          env:
            - name: REDIS_HOST
              value: "redis"
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arb-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          # ml_scorer.py only exposes POST /score (no GET health route), so use a
          # TCP probe against the gunicorn listener on 3002.
          livenessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      imagePullSecrets:
        - name: regcred
---
apiVersion: v1
kind: Service
metadata:
  name: ml-scorer-svc
  namespace: flashloan-arb
spec:
  selector:
    app: ml-scorer
  ports:
    - port: 3002
      targetPort: 3002
  type: ClusterIP
