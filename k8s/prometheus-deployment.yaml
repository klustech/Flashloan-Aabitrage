apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: flashloan-arb
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'bot-logic'
        metrics_path: /metrics
        static_configs:
          - targets: ['bot-logic-svc:3001']
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: flashloan-arb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: flashloan-arb
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
