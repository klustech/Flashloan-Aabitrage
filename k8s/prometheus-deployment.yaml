apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: flashloan-arb
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    # TODO: No Alertmanager Service is defined in these manifests yet. Deploy an
    # Alertmanager (using infra/alertmanager.yml as its config) and wire it here,
    # e.g.:
    #   alerting:
    #     alertmanagers:
    #       - static_configs:
    #           - targets: ['alertmanager-svc:9093']
    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    rule_files: []

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Arbitrage bot metrics
      - job_name: 'bot-logic'
        metrics_path: /metrics
        static_configs:
          - targets: ['bot-logic-svc:3001']
        scrape_interval: 10s

      # ML scorer metrics
      - job_name: 'ml-scorer'
        static_configs:
          - targets: ['ml-scorer-svc:3002']
        metrics_path: /metrics
        scrape_interval: 30s
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: flashloan-arb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-svc
  namespace: flashloan-arb
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
