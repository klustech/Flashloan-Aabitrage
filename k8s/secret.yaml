# ═══════════════════════════════════════════════════════════════════════════════
# KUBERNETES SECRETS - Flashloan Arbitrage Bot
# ═══════════════════════════════════════════════════════════════════════════════
# All values must be base64 encoded:
#   echo -n "your-value" | base64
#
# SECURITY: Never commit real secrets to version control!
# Use kubectl create secret or external secrets manager (AWS, Vault, etc.)
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: Secret
metadata:
  name: arb-secrets
  namespace: flashloan-arb
  labels:
    app: flashloan-arb
type: Opaque
data:
  # ─── Required Secrets ───────────────────────────────────────────────────────
  # Bot wallet private key (0x...)
  PRIVATE_KEY: BASE64_PRIVATE_KEY

  # RPC/WebSocket URLs (base64 encoded)
  MAINNET_RPC_URL: BASE64_MAINNET_RPC_URL
  MAINNET_WEBSOCKET: BASE64_WSS_URL

  # API Keys
  INFURA_KEY: BASE64_INFURA_KEY
  ALCHEMY_API_KEY: BASE64_ALCHEMY_KEY

  # ─── Database Secrets ───────────────────────────────────────────────────────
  # PostgreSQL connection string
  DATABASE_URL: BASE64_DATABASE_URL
  PG_PASSWORD: BASE64_PG_PASSWORD

  # Redis password
  REDIS_PASSWORD: BASE64_REDIS_PASSWORD

  # ─── Optional Service Secrets ───────────────────────────────────────────────
  # Slack webhook for alerts
  SLACK_WEBHOOK_URL: BASE64_SLACK_WEBHOOK

  # ML model API secret
  SCORER_SHARED_SECRET: BASE64_SCORER_SECRET

  # Etherscan API key (for contract verification)
  ETHERSCAN_API_KEY: BASE64_ETHERSCAN_KEY

  # TheGraph API key
  THEGRAPH_API_KEY: BASE64_THEGRAPH_KEY
---
# ═══════════════════════════════════════════════════════════════════════════════
# ConfigMap for non-sensitive bot configuration
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: arb-config
  namespace: flashloan-arb
  labels:
    app: flashloan-arb
data:
  # Network
  CHAIN_ID: "1"
  NODE_ENV: "production"

  # Contract addresses (mainnet)
  AAVE_LENDING_POOL_ADDRESS_PROVIDER: "0xB53C1a33016B2DC2fF3653530bfF1848a515c8c5"
  UNISWAP_ROUTER_ADDRESS: "0x7a250d5630B4cF539739dF2C5dAcb4c659F2488D"
  SUSHISWAP_ROUTER_ADDRESS: "0xd9e1cE17f2641f24aE83637ab66a2cca9C378B9F"
  UNISWAP_V3_ROUTER: "0xE592427A0AEce92De3Edee1F18E0157C05861564"
  BALANCER_VAULT: "0xBA12222222228d8Ba445958a75a0704d566BF2C8"

  # Token addresses
  TOKENS_DAI: "0x6B175474E89094C44Da98b954EedeCAE3686F72e"
  TOKENS_WETH: "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
  TOKENS_USDC: "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"

  # Route discovery
  ALLOW_LNG_CYCLES: "true"
  DYNAMIC_ROUTE_HOPS: "3"
  DYNAMIC_ROUTE_TOPN: "100"
  DYNAMIC_ROUTE_MIN_LIQUIDITY_USD: "100000"
  REALTIME_POOL_COUNT: "100"

  # DEX inclusion
  INCLUDE_UNISWAP_V2: "true"
  INCLUDE_SUSHISWAP_V2: "true"
  INCLUDE_V3: "true"
  INCLUDE_BALANCER: "true"
  INCLUDE_CURVE: "false"

  # Risk management
  MIN_PROFIT_DAI: "5"
  GAS_PRICE_CEILING: "50"
  SLIPPAGE_BIPS: "50"
  FLASHLOAN_PREMIUM_BIPS: "9"
  DAILY_DRAWDOWN_LIMIT_DAI: "100"
  CB_NEG_THRESHOLD: "5"

  # ML/Statistical
  ZSCORE_THRESHOLD: "2"
  ML_TOPK: "50"

  # Flashbots
  FLASHBOTS_RELAY_URL: "https://relay.flashbots.net"
  FLASHBOTS_BUNDLE_COUNT: "3"
  PRIO_PERCENT: "10"
  PRIO_FEE_MAX_GWEI: "50"

  # Server
  SERVER_PORT: "3001"
---
# ═══════════════════════════════════════════════════════════════════════════════
# Prometheus ConfigMap
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: flashloan-arb
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    alerting:
      alertmanagers:
        - static_configs:
            - targets: []

    rule_files: []

    scrape_configs:
      # Prometheus self-monitoring
      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']

      # Arbitrage bot metrics
      - job_name: 'flashloan-bot'
        static_configs:
          - targets: ['flashloan-bot-svc:3001']
        metrics_path: '/metrics'
        scrape_interval: 10s

      # ML scorer metrics
      - job_name: 'ml-scorer'
        static_configs:
          - targets: ['ml-scorer-svc:3002']
        metrics_path: '/metrics'
        scrape_interval: 30s

      # Redis exporter (if deployed)
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']
        scrape_interval: 30s

      # Kubernetes pods (if using kube-state-metrics)
      - job_name: 'kubernetes-pods'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - flashloan-arb
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
---
# ═══════════════════════════════════════════════════════════════════════════════
# Grafana ConfigMap for dashboards
# ═══════════════════════════════════════════════════════════════════════════════
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: flashloan-arb
  labels:
    app: grafana
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: 'Flashloan Arbitrage'
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        options:
          path: /var/lib/grafana/dashboards
